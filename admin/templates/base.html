<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1f52">
  <title>{% block title %}SGW Termine{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header class="top">
    <a class="logo-tile" href="{{ url_for('main.index') }}"><img src="{{ url_for('static', filename='logo.png') }}" alt="SGW Essen" width="46" height="46"></a>
    <div class="top-text">
      {% if g.user %}<small>Hallo {{ g.user.display_name }} 👋</small>{% else %}<small>SG Wasserball Essen</small>{% endif %}
      <b>{% block heading %}Termine{% endblock %}</b>
    </div>
    {% if g.user %}
    <details class="menu">
      <summary aria-label="Menü">☰</summary>
      <div class="menu-panel">
        <form method="post" action="{{ url_for('main.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit">Abmelden</button>
        </form>
        <form method="post" action="{{ url_for('main.logout_everywhere') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit">Überall abmelden</button>
        </form>
      </div>
    </details>
    {% endif %}
  </header>
  {% if banner %}<div class="banner banner-{{ banner.level }}" role="alert">{{ banner.text }}</div>{% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
