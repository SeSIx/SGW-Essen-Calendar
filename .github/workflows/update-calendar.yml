name: Update calendar

on:
  schedule:
    # Runners are on UTC; these are 10:15 and 22:15 Europe/Berlin during CEST.
    - cron: "15 8 * * *"
    - cron: "15 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The SQLite files are not in version control, so without this cache every
      # run would refetch all ~75 throttled detail pages instead of the handful
      # that actually changed.
      - name: Restore scraped data
        uses: actions/cache@v6
        with:
          path: output
          key: dsv-data-${{ github.run_id }}
          restore-keys: |
            dsv-data-

      - name: Scrape DSV and rebuild calendars
        id: scrape
        run: |
          set +e
          python main.py 2>&1 | tee run.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit changed calendars
        run: |
          git config user.name "SGW Bot"
          git config user.email "bot@sgw-essen.local"
          git add -- '*.ics'
          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "Auto-update: calendars $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Subscribers from before the branch consolidation still poll the old
      # sgw-scraper-rewrite URL, so it has to follow the default branch on
      # every run -- doing it only when a calendar changed left it ten days
      # behind after a hand-written commit. Reading the target sha from the
      # API rather than the shallow checkout keeps the move a fast-forward
      # even if someone pushed while the scrape was running.
      - name: Keep the legacy branch on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}" --jq .object.sha)
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/sgw-scraper-rewrite" \
            -f sha="$target" --jq '.ref + " -> " + .object.sha'

      - name: Raise alarm
        if: steps.scrape.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create scrape-alarm --color B60205 \
            --description "Scraper produced no usable calendar" --force
          summary=$(tail -30 run.log)
          body=$(printf '%s\n\n```\n%s\n```\n\n[Run](%s/%s/actions/runs/%s)\n' \
            "\`main.py\` exited with code ${{ steps.scrape.outputs.exit_code }}. Either the DSV has not published the new season yet, or the parser broke. The calendar is not updating until this is resolved." \
            "$summary" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --label scrape-alarm --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Scraper alarm: no upcoming fixtures" \
              --label scrape-alarm --body "$body"
          fi
          exit 1
